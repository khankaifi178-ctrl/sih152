version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: infra/Dockerfile.backend
    container_name: social_lens_backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - JWT_SECRET=ntro-social-lens-secret-key-production
      - DATABASE_URL=postgres://ntro:ntro123@timescaledb:5432/social_lens
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./data/sample:/app/data/sample
      - ./backend/audit.log:/app/backend/audit.log
    depends_on:
      - timescaledb
      - redis

  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: social_lens_db
    environment:
      POSTGRES_USER: ntro
      POSTGRES_PASSWORD: ntro123
      POSTGRES_DB: social_lens
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: social_lens_redis
    ports:
      - "6379:6379"

networks:
  default:
    name: social_lens_network
